<!doctype html>
<html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vexor Growth · Lista e ruajtur</title>
<style>
body{margin:0;background:#0a0a0a;color:#f2f2f2;font:17px/1.6 system-ui,sans-serif}
main{max-width:720px;margin:auto;padding:24px}
.brand b{letter-spacing:6px;font-size:20px}.brand span{display:block;font-size:11px;letter-spacing:5px;color:#9a9a9a}
.eyebrow{font-size:12px;letter-spacing:3px;color:#a8a8a8;text-transform:uppercase;margin-top:24px}
h1{font-size:clamp(26px,7vw,38px);margin:4px 0 16px}
button,a{font:inherit;color:inherit}
button{padding:12px 18px;border:none;border-radius:12px;background:#dcdcdc;color:#111;font-weight:600;cursor:pointer}
button:disabled{background:#2a2a2a;color:#8a8a8a;cursor:not-allowed}
a{color:#d0d0d0}
.karta{padding:16px 18px;margin:14px 0;border:1px solid #333;border-radius:14px;background:#141414}
.karta h2{font-size:19px;margin:6px 0 4px}
.kategoria{font-size:12px;padding:3px 10px;border-radius:12px;background:#2a2a2a;color:#d0d0d0}
.karta p{margin:4px 0;color:#bdbdbd}
#source{padding:14px 16px;border-left:4px solid #c0c0c0;background:#1a1a1a}
time{overflow-wrap:anywhere}
*:focus-visible{outline:3px solid #c0c0c0;outline-offset:4px}
</style></head><body><main>
<div class="brand"><b>VEXOR</b><span>GROWTH</span></div>
<p class="eyebrow">Lexim publik</p><h1>Shërbimet, edhe pa internet</h1>
<p id="source" role="status" aria-live="polite">Po lexojmë listën…</p>
<p>Ruajtur për herë të fundit: <time id="saved">—</time></p>
<button id="refresh" type="button">Rifresko listën</button>
<div id="lista"></div>
<button id="kerkesa" disabled>Dërgo kërkesë · kërkon lidhje dhe server</button>
<p>Kjo pamje shërben vetëm për lexim. Afatet dhe shërbimet mund të kenë ndryshuar; asnjë kërkesë nuk dërgohet nga këtu.</p>
<a href="/">Kthehu te aplikacioni</a>
</main><script>
const source = document.querySelector("#source"), lista = document.querySelector("#lista");
const refresh = document.querySelector("#refresh");
async function load() {
  refresh.disabled = true;
  source.textContent = "Po kërkojmë listën…";
  try {
    const response = await fetch("/api/sherbimet", { cache: "no-store" });
    const data = await response.json();
    if (!response.ok || !Array.isArray(data.sherbimet)) throw new Error("no_snapshot");
    lista.replaceChildren();
    for (const s of data.sherbimet) {
      const karta = document.createElement("article"); karta.className = "karta";
      const kat = document.createElement("span"); kat.className = "kategoria"; kat.textContent = s.kategoria;
      const titulli = document.createElement("h2"); titulli.textContent = s.emri;
      const pershkrimi = document.createElement("p"); pershkrimi.textContent = s.pershkrimi;
      const detajet = document.createElement("p");
      detajet.textContent = "Afati: " + s.afati + " · " + s.menyra;
      karta.append(kat, titulli, pershkrimi, detajet); lista.append(karta);
    }
    const saved = response.headers.get("x-vexor-saved-at");
    document.querySelector("#saved").textContent = saved ? new Date(saved).toLocaleString("sq-AL") : "Lexuar drejtpërdrejt; kopja ende nuk u ruajt.";
    source.textContent = response.headers.get("x-vexor-source") === "cache"
      ? "Lista e fundit e ruajtur · Mund të jetë vjetruar. Serveri nuk u arrit."
      : "Lista erdhi nga serveri. Lexo sërish para se të dërgosh kërkesë.";
  } catch {
    source.textContent = lista.children.length
      ? "Lidhja dështoi. Lista në ekran është e mëparshme."
      : "Ende nuk ka listë të ruajtur. Hape aplikacionin me internet dhe provo përsëri.";
  } finally { refresh.disabled = false; }
}
refresh.addEventListener("click", load);
window.addEventListener("offline", () => { source.textContent = "Lidhja duket e ndërprerë. Lista e shfaqur mund të jetë e vjetër."; });
window.addEventListener("online", () => { source.textContent = "Rrjeti duket i lidhur. Shtyp Rifresko listën për ta pyetur serverin."; });
load();
</script></body></html>
